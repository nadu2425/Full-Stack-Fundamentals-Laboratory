
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">My To-Do List</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="todo-container mx-auto">

            <h1 class="text-center mb-4">My Tasks</h1>

            <form id="taskForm">
                <div class="input-group mb-2">
                    <input
                        type="text"
                        id="taskInput"
                        class="form-control"
                        placeholder="Enter a new task">

                    <button type="submit" class="btn btn-primary">
                        Add Task
                    </button>
                </div>
            </form>

            <p id="errorMessage" class="text-danger"></p>

            <div class="d-flex gap-2 mb-3">
                <button type="button" class="btn btn-outline-primary" data-filter="all">
                    All
                </button>

                <button type="button" class="btn btn-outline-primary" data-filter="active">
                    Active
                </button>

                <button type="button" class="btn btn-outline-primary" data-filter="completed">
                    Completed
                </button>
            </div>

            <p id="taskCounter">0 tasks left</p>

            <ul id="taskList" class="list-group"></ul>

            <button
                id="clearCompletedBtn"
                class="btn btn-danger mt-3"
                type="button">
                Clear Completed
            </button>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
